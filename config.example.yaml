# Copy to the config directory the installer prints.
# API keys and plug tokens do not go in this file.
# Use HAILPORTS_API_KEY, or the matching name in .env.example, or the OS keychain.
label: com.hailports.local
mode: local
llm:
  base_url: http://127.0.0.1:18080/v1
  upstream_url: http://127.0.0.1:18080
  model: local
  model_url: ""
  mmproj_url: ""
  quant: ""
webchat:
  bind: 127.0.0.1
  port: 8080
notes:
  bind: 127.0.0.1
  port: 8078
  embed_url: http://127.0.0.1:8097
  max_age_s: 86400
brain:
  bind: 127.0.0.1
  port: 8079
  # Empty token: loopback is the access check. Set HAILPORTS_BRAIN_TOKEN to require a bearer token.
  token_env: HAILPORTS_BRAIN_TOKEN
  allow_overlay: false
display:
  # 0 means "not set". A dummy plug and a built-in panel use their own vendor and product ids.
  vendor: 0
  product: 0
local_bridges:
  mail:
    enabled: false
    base_url: http://127.0.0.1:9222
  meetings:
    enabled: false
    base_url: http://127.0.0.1:9223
  tracker:
    enabled: false
    base_url: http://127.0.0.1:9224
  cdp:
    enabled: false
    base_url: http://127.0.0.1:9222
integrations:
  # off, native, bridges, or accounts. hailports setup writes this.
  kind: off
# Account sessions. Empty until setup. Edge is installed by brew, winget, or the distro package.
accounts:
edge:
  browser: edge
  path: ""
  install: ""
  bundled: false
  headful: true
  corner: lower-right
paiste:
  enabled: false
  copy: true
  notes: off
  notes_dir: ""
  obsidian_vault: ""
  mail: off
  email_dir: ""
  chat: off
  chat_dir: ""
  calendar: off
  calendar_dir: ""
  brain_db: ""
  # First hop wins. http is a server on this computer. ssh runs curl on a computer you own.
  # Blank ssh_host is skipped. Nothing is sent. hailports paiste setup asks before it writes these.
  order:
    - local
  models:
    local:
      via: http
      base_url: http://127.0.0.1:18080/v1
      model: local
      ssh_host: ""
      remote_url: ""
web:
  search_url: ""
  news_url: ""
alerts:
  probe_url: ""
  private_url: ""
idle:
  interval_s: 120
  # Pull requests clipped into a deep note must use one of these owner/name pairs.
  # Leave this empty to keep every pull page you already stored.
  allowed_repos: []
thread:
  summary_chars: 2400
modules:
  cli: true
  webchat: true
  imessage: false
  bridges: false
  notes: true
  draft_runner: false
  plugins: false
memory:
  budget_mb: 0
runbooks:
  dir: runbooks
plugins:
  crm:
    base_url: https://crm.example.invalid
    token: CHANGE_ME
  tracker:
    base_url: https://tracker.example.invalid
    token: CHANGE_ME
    project: PROJECT
  mail:
    base_url: https://mail.example.invalid
    token: CHANGE_ME
  meetings:
    base_url: https://meet.example.invalid
    token: CHANGE_ME
  files:
    base_url: https://files.example.invalid
    token: CHANGE_ME
bridges:
  telegram:
    token: CHANGE_ME
    chat_id: CHANGE_ME
  signal:
    base_url: http://127.0.0.1:8088
    account: CHANGE_ME
  matrix:
    homeserver: https://matrix.example.invalid
    token: CHANGE_ME
    room: CHANGE_ME
imessage:
  allowed_handle: CHANGE_ME
cloud:
  provider: openai
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  key_env: HAILPORTS_API_KEY
  keychain_service: hailports
  keychain_account: cloud
routing:
  confidence_floor: 0.55
  complexity_ceiling: 1
  max_local_output_chars: 900
  compact_char_budget: 1600

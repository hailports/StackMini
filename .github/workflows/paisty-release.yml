name: paisty-release

# Every push to main that touches the app builds paisty, signs the self-update feed and
# uploads it to the R2 bucket behind paisty.com. The disk image is only reachable through the
# email form (/dl); the update feed (/api/update/*) answers only to installed copies.
# Installed copies pick an update up on their next check (20 s after launch, every 3 hours, on wake),
# with the baked feed token or their own license key. /dl always serves the paisty.dmg uploaded here,
# so a new download is this build and updates itself from then on.
#
# Build numbers are commits x 10. A manual run with `rebuild: 1..9` republishes the same code as the
# next build up, which is how an update is tested end to end without a commit.
on:
  push:
    branches: [main]
    paths:
      - "contrib/clip/**"
      - "hailports/clip/**"
      - "hailports/llm.py"
      - "hailports/config.py"
      - "hailports/chat_badge.py"
      - "hailports/promptui.py"
      - "hailports/__init__.py"
      - ".github/workflows/paisty-release.yml"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "0 = normal; 1-9 republishes this commit one step up (update test)"
        default: "0"
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: paisty-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clip tests
        env:
          HAILPORTS_NO_KEYCHAIN: "1"
          HAILPORTS_PROMPT: plain
        run: |
          python -m pip install -q -e ".[dev]" cryptography
          python -m pytest -q tests/test_clip_compose.py tests/test_clip_hops.py tests/test_clip.py tests/test_clip_owndraft.py tests/test_clip_pulse_swift.py tests/test_clip_license.py
      - name: bundled python
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ~/.local/bin/uv python install 3.12
          PY=$(dirname "$(dirname "$(~/.local/bin/uv python find 3.12)")")
          echo "PAISTY_PYTHON_PREFIX=$PY" >> "$GITHUB_ENV"
      - name: version
        env:
          REBUILD_INPUT: ${{ github.event.inputs.rebuild }}
        run: |
          COUNT=$(git rev-list --count HEAD)
          REBUILD="${REBUILD_INPUT:-0}"
          case "$REBUILD" in [0-9]) ;; *) echo "rebuild must be 0-9"; exit 1 ;; esac
          BUILD=$((COUNT * 10 + REBUILD))
          VERSION="1.1.$COUNT"
          [ "$REBUILD" = 0 ] || VERSION="$VERSION.$REBUILD"
          echo "PAISTY_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "PAISTY_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version $VERSION build $BUILD"
      - name: build app, disk image and update zip
        env:
          PAISTY_OUT: ${{ github.workspace }}/dist
          PAISTY_FEED_TOKEN: ${{ secrets.PAISTY_FEED_TOKEN }}
        run: |
          if [ -z "$PAISTY_FEED_TOKEN" ]; then echo "PAISTY_FEED_TOKEN missing"; exit 1; fi
          sh contrib/clip/package.sh
      - name: leak gate
        env:
          PATTERNS: ${{ secrets.PAISTY_LEAK_PATTERNS }}
        run: |
          if [ -z "$PATTERNS" ]; then echo "::warning::PAISTY_LEAK_PATTERNS not set; leak gate skipped"; exit 0; fi
          printf '%s\n' "$PATTERNS" > /tmp/leak.re
          mkdir -p /tmp/unz && ditto -x -k dist/paisty-update.zip /tmp/unz
          if grep -rlaiE -f /tmp/leak.re /tmp/unz; then echo "identity strings in the app"; exit 1; fi
          echo clean
      - name: sign update feed
        env:
          PAISTY_ED_PRIVATE_KEY: ${{ secrets.PAISTY_ED_PRIVATE_KEY }}
        run: |
          URL="https://www.paisty.com/api/update/paisty-update-$PAISTY_BUILD.zip"
          python contrib/clip/sign_update.py --zip dist/paisty-update.zip --version "$PAISTY_VERSION" \
            --build "$PAISTY_BUILD" --url "$URL" --notes "$(git log -1 --format=%s)" --out dist/paisty-update.json
      - name: publish to R2
        env:
          R2_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          R2_ENDPOINT="https://$R2_ACCOUNT.r2.cloudflarestorage.com/paisty-downloads"
          put() {
            code=$(curl -s -o /dev/null -w "%{http_code}" --aws-sigv4 "aws:amz:auto:s3" --user "$R2_ID:$R2_SECRET" \
              -H "content-type: $3" -T "$1" "$R2_ENDPOINT/$2")
            echo "$2 $code"
            [ "$code" = "200" ]
          }
          # The zip first, the feed last, so a copy never sees a feed whose file is not there yet.
          put dist/paisty-update.zip "updates/paisty-update-$PAISTY_BUILD.zip" application/zip
          put dist/paisty.dmg paisty.dmg application/x-apple-diskimage
          put dist/paisty-update.json updates/paisty-update.json application/json
          # The form's download (/dl) streams R2 paisty.dmg. Read it back: it must be this build.
          curl -s -o dist/served.dmg --aws-sigv4 "aws:amz:auto:s3" --user "$R2_ID:$R2_SECRET" "$R2_ENDPOINT/paisty.dmg"
          if [ "$(shasum -a 256 < dist/served.dmg)" != "$(shasum -a 256 < dist/paisty.dmg)" ]; then echo "R2 paisty.dmg is not this build"; exit 1; fi
          echo "form download serves $PAISTY_VERSION ($PAISTY_BUILD)"

  # Copies from 1.1.139 and 1.1.140 read a feed on GitHub. A bridge release there moves them to the
  # R2 feed once; after the cutoff it is deleted so nothing is downloadable without the form.
  retire-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: delete the GitHub bridge after the cutoff
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOFF: "2026-11-27"
        run: |
          if [ "$(date -u +%Y-%m-%d)" \< "$CUTOFF" ]; then echo "bridge kept until $CUTOFF"; exit 0; fi
          for tag in paisty-bridge paisty-mac; do
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null && echo "deleted $tag" || echo "no $tag"
          done
